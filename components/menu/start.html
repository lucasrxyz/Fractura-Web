<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- <link rel="stylesheet" href="../../styles/menu_principal.css"> -->
   <style>
    
    body {
  margin: 0;
  background: black;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  user-select: none;
  font-family: cutepixel !important;
    }
/* --- Animation titre --- */
.stack {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 50px;
}

.stack img {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.5);
  transform-origin: center;
  opacity: 0;
  animation: pop 0.5s forwards, pulse 0.3s forwards;
}

@keyframes pop {
  to { opacity: 1; transform: translate(-50%, -50%) scale(3); }
}

@keyframes pulse {
  from { transform: translate(-50%, -50%) scale(3); }
  to { transform: translate(-50%, -150%) scale(3.1); }
}

.stack img:nth-child(1) { animation-delay: 0ms, 3000ms; }
.stack img:nth-child(2) { animation-delay: 300ms, 3000ms; }
.stack img:nth-child(3) { animation-delay: 600ms, 3000ms; }
.stack img:nth-child(4) { animation-delay: 900ms, 3000ms; }
.stack img:nth-child(5) { animation-delay: 1200ms, 3000ms; }
.stack img:nth-child(6) { animation-delay: 1500ms, 3000ms; }
.stack img:nth-child(7) { animation-delay: 1800ms, 3000ms; }
.stack img:nth-child(8) { animation-delay: 2100ms, 3000ms; }

/* --- Press Start --- */
.press-start {
  opacity: 0;
  margin-top: 150px;
  transform: scale(3);
  animation: fadeIn 1s forwards, float 1s infinite alternate;
  animation-delay: 3400ms, 4400ms;
}

@keyframes fadeIn { to { opacity: 1; } }
@keyframes float { 
  0% { transform: translateY(0) scale(3); } 
  100% { transform: translateY(-5px) scale(3); } 
}

/* --- Police pixelisée --- */
@font-face {
  font-family: 'pixelise';
  src: url('../../assets/fonts/Retro Gaming.ttf') format('truetype');
}

/* --- Texte version --- */
.version-text {
  position: fixed;
  bottom: 10px;
  left: 10px;
  font-family: 'pixelise', monospace;
  font-size: 14px;
  color: white;
  z-index: 50;
}

/* --- Menu principal --- */
.menu-buttons {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-top: 50px;
  align-items: center;
  pointer-events: none;
}

.menu-buttons.show { pointer-events: auto; }

.menu-btn {
  font-family: 'pixelise', monospace;
  font-size: 24px;
  color: white;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 20px;
  cursor: pointer;
  transition: all 0.15s ease-out;
  transform: scale(0.6) rotate(0deg);
  opacity: 0;
}

.menu-buttons.show .menu-btn:nth-child(1) {
  animation: buttonAppear 0.3s forwards 0.1s;
}
.menu-buttons.show .menu-btn:nth-child(2) {
  animation: buttonAppear 0.3s forwards 0.25s;
}

@keyframes buttonAppear {
  from { opacity: 0; transform: scale(0.6) rotate(0deg); }
  to   { opacity: 1; transform: scale(1) rotate(0deg); }
}

.menu-btn:hover,
.menu-btn.active {
  background-color: #6800E4;
  border-bottom: 6px solid #8226CD;
  transform: scale(1) rotate(3deg);
}

.menu-btn:active {
  transform: scale(1.25) rotate(-2deg);
  background-color: #39017d;
  border-bottom: none;
}

.menu-btn.keyboard-active {
  background-color: #39017d;
  border-bottom: none;
}

.menu-btn:focus { outline: none; }

/* --- Infos contrôles --- */
.controls-info {
  position: fixed;
  bottom: 30px;
  right: 10px;
  font-family: 'pixelise', monospace;
  font-size: 14px;
  color: white;
  display: flex;
  align-items: center;
  gap: 5px;
  z-index: 50;
}

.controls-info .fleches {
  transform: scale(3.2);
  margin-right: 30px;
  width: 21px;
  height: 10px;
  display: inline-block;
}

.controls-info .entrer {
  transform: scale(3.2);
  margin-right: 30px;
  width: 19px;
  height: 13px;
  display: inline-block;
}

#controlsInfo {
  opacity: 0;
  transition: opacity 0.5s ease-in-out;
}
#controlsInfo.show { opacity: 1; }

/* --- Slots --- */
.slots-container {
  display: none;
  margin-top: 66px;
  display: grid;
  grid-template-columns: repeat(4, 130px);
  gap: 20px;
  justify-content: center;
  z-index: 100;
}

.slot {
  width: 130px;
  height: 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  cursor: pointer;
  opacity: 0;
  transform: scale(0.8);
  animation: slotAppear 0.5s forwards;
}

.slot:nth-child(1) { animation-delay: 0.1s; }
.slot:nth-child(2) { animation-delay: 0.25s; }
.slot:nth-child(3) { animation-delay: 0.4s; }
.slot:nth-child(4) { animation-delay: 0.55s; }

.slot img {
  width: 65px;
  height: 65px;
  transform: scale(2);
  transform-origin: center;
}

.slot img:hover {
  transform: translate(-2%, -2%) scale(2.1) rotate(3deg);
  transition: transform 0.2s ease-in-out;
}

.slot img:active {
  transform: translate(-2%, -2%) scale(2.3) rotate(-2deg);
  transition: transform 0.2s ease-in-out;
}

/* Label des slots */
.slot-label {
  margin-top: 30px;
  font-family: 'pixelise', monospace;
  font-size: 14px;
  color: white;
}

/* Apparition slot */
@keyframes slotAppear {
  from { opacity: 0; transform: scale(0.8); }
  to   { opacity: 1; transform: scale(1); }
}

/* --- Formulaire modal (au-dessus de tout) --- */
@keyframes slotFormAppear {
  from { opacity: 0; transform: scale(1.5) rotate(-4deg); }
  to   { opacity: 1; transform: scale(2); }
}

.slot-form {
  position: fixed;
  top: 50%;
  left: 38%;
  width: 400px;
  height: 220px;
  background: #6800E4;
  color: white;
  font-family: 'pixelise', monospace;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 15px;
  border-bottom: 5px solid #8226CD;
  border-radius: 8px;
  z-index: 99999;
  transform: translate(-50%, -50%);
  animation: slotFormAppear 0.3s ease-out forwards;
}

/* Titre en haut */
.slot-form h2 {
  margin: 0;
  text-align: center;
  font-size: 18px;
  border-bottom: 2px solid #8226CD;
  padding-bottom: 8px;
}
/* Zone centrale pour inputs */
.slot-form .form-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  align-items: center;
}
/* Bas avec boutons */
.slot-form .form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 15px;
}
.slot-form button {
  background: none;
  padding:4px;
  border: none;
  color: white;
  font-family: 'pixelise', monospace;
  font-size: 14px;
  cursor: pointer;
  transition:0.2s ease-in-out;
}

.slot-form button:hover {
  background-color:#ffffff11;
  transition:0.2s ease-in-out;
}
/* Inputs et select dans la modale */
.slot-form input,
.slot-form select {
  width: 90%;
  margin: 3px 0;
  font-size: 10px;
  font-family: 'pixelise', monospace;
  background: #39017d;
  border: none;
  border-bottom: 2px solid #8226CD;
  color: white;
  padding: 2px;
  text-align: center;
}

.slot-form input:focus,
.slot-form select:focus {
  outline: none;
  border-bottom: 2px solid #fff;
}
.difficulty-options {
  display: flex;
  justify-content: center;
  gap: 15px;
}

.difficulty-btn {
  font-family: 'pixelise', monospace;
  font-size: 14px;
  padding: 8px 14px;
  cursor: pointer;
  transition: 0.2s;
  color: #3c0084 !important;
  background-color: none !important;
}

.difficulty-btn:hover {
  border-bottom:2px solid #ffffff11;
  transform: scale(1.1) rotate(2deg);
}

.difficulty-btn.active {
  background: #ffffffaa;
}
   </style>

</head>
<body>
  <div class="stack">
    <img src="../../components/menu/lettres fractura/f.png" alt="F">

  </div>

  <div class="press-start" id="pressStart">
    <img src="../../components/menu/start_kb.png" alt="Press Start">
  </div>

  <div class="menu-buttons" id="menuButtons">
    <button class="menu-btn" id="btnContinue" onclick="debug()">Continuer</button>
    <button class="menu-btn" id="btnNewGame" onclick="showSlots()">Charger une partie</button>
  </div>
  
  <!-- Conteneur des slots (caché au départ) -->
    <div class="slots-container" id="slotsContainer" style="display: none;">
    <div class="slot" onclick="createSlot(this, 1)">
      <img src="../../assets/UI/+.png" alt="+" width="65" height="65">
      <div class="slot-label">Partie 1</div>
    </div>
    <div class="slot" onclick="createSlot(this, 2)">
      <img src="../../assets/UI/+.png" alt="+" width="65" height="65">
      <div class="slot-label">Partie 2</div>
    </div>
    <div class="slot" onclick="createSlot(this, 3)">
      <img src="../../assets/UI/+.png" alt="+" width="65" height="65">
      <div class="slot-label">Partie 3</div>
    </div>
    <div class="slot" onclick="createSlot(this, 4)">
      <img src="../../assets/UI/+.png" alt="+" width="65" height="65">
      <div class="slot-label">Partie 4</div>
    </div>
  </div>


  <div class="controls-info" id="controlsInfo">
    <img src="../../assets/UI/title screen/up_down_arrows.png" alt="Flèches" class="fleches"> 
    <span style="font-size:25px;">Flèches Naviguer &nbsp;&nbsp;&nbsp;&nbsp; </span>
    <img src="../../assets/UI/title screen/entrer_blanc.png" alt="Entrée" class="entrer"> 
    <span style="font-size:25px;">Valider</span>
  </div>


  <script>
    const menuButtons = document.querySelectorAll('.menu-btn');
    let activeIndex = -1; // aucun bouton sélectionné par défaut

    function debug() {
        console.log("Bouton cliqué !");
    }
    document.addEventListener('keydown', function(event) {
      const menu = document.getElementById('menuButtons');
      const pressStart = document.getElementById('pressStart');
      const controlsInfo = document.getElementById('controlsInfo');

      // Affiche les boutons après "Press Start"
      if (!menu.classList.contains('show')) {
        if (event.key === 'Enter') {
          pressStart.style.display = 'none';
          menu.classList.add('show');
          controlsInfo.classList.add('show'); // affiche les textes des contrôles
        }
        return;
      }

      // Navigation dans les boutons
      if (event.key === 'ArrowDown') {
        if (activeIndex >= 0) menuButtons[activeIndex].classList.remove('active');
        activeIndex = (activeIndex + 1) % menuButtons.length;
        menuButtons[activeIndex].classList.add('active');
      } else if (event.key === 'ArrowUp') {
        if (activeIndex >= 0) menuButtons[activeIndex].classList.remove('active');
        activeIndex = (activeIndex - 1 + menuButtons.length) % menuButtons.length;
        menuButtons[activeIndex].classList.add('active');
      } else if (event.key === 'Enter') {
        if (activeIndex >= 0) {
          const btn = menuButtons[activeIndex];
          btn.classList.add('keyboard-active');  // simule le style :active
          btn.click();                           // déclenche l'action
          setTimeout(() => btn.classList.remove('keyboard-active'), 150); // retire l'effet
        }
      }
    });

    function showSlots() {
      const slots = document.getElementById("slotsContainer");
      // toggle affichage
      if (slots.style.display === "none" || slots.style.display === "") {
        slots.style.display = "grid"; // affiche les slots
      } else {
        slots.style.display = "none"; // masque si déjà affichés
      }
    }


   function createSlot(slotElement, index) {
  // Vérifie si une partie existe déjà dans ce slot
  const existingName = localStorage.getItem(`slot${index}name`);
  const existingDifficulty = localStorage.getItem(`slot${index}difficulty`);

  if (existingName && existingDifficulty) {
    alert(`Slot ${index} déjà utilisé :\nNom : ${existingName}\nDifficulté : ${existingDifficulty}`);
    return;
  }

  // Supprimer toute modale déjà ouverte
  const oldForm = document.querySelector(".slot-form");
  if (oldForm) oldForm.remove();

  // Créer la div modale
  const form = document.createElement("div");
  form.className = "slot-form";

  form.innerHTML = `
    <h2>Commencer une nouvelle partie</h2>
    <div class="form-body">
      <input type="text" placeholder="Nom" id="slotName" />
      <div class="difficulty-options">
        <button class="difficulty-btn" onclick="selectDifficulty(this, 'Facile')">Facile</button>
        <button class="difficulty-btn" onclick="selectDifficulty(this, 'Moyen')">Moyen</button>
        <button class="difficulty-btn" onclick="selectDifficulty(this, 'Difficile')">Difficile</button>
      </div>
    </div>
    <div class="form-actions">
      <button onclick="closeSlotForm()">Annuler</button>
      <button onclick="startNewGame(${index})">Commencer</button>
    </div>
  `;

  document.body.appendChild(form);
}

function closeSlotForm() {
  const form = document.querySelector(".slot-form");
  if (form) form.remove();
}

function startNewGame(index) {
  const nameInput = document.getElementById("slotName");
  const name = nameInput ? nameInput.value.trim() : null; // si c'est un nouveau slot

  if (!nameInput) {
    // Slot déjà utilisé → rien à valider côté nom
    console.log("Slot sélectionné :", index);
    localStorage.setItem("idSlot", index);
    window.location.href = "../runes/spawn first/runes640x360_c1.html";
    return;
  }

  if (!name) {
    alert("Veuillez entrer un nom pour la partie !");
    return;
  }

  if (!chosenDifficulty) {
    alert("Veuillez choisir une difficulté !");
    return;
  }

  // Sauvegarde dans le localStorage
  localStorage.setItem("idSlot", index);
  localStorage.setItem(`slot${index}name`, name);
  localStorage.setItem(`slot${index}difficulty`, chosenDifficulty);

  // Mettre l'image du slot en opacity 50%
  const slots = document.querySelectorAll('.slot');
  const slotImg = slots[index - 1].querySelector('img');
  slotImg.style.opacity = "0.5";

  console.log("Nouvelle partie créée. idSlot :", index);

  // Redirection
  window.location.href = "../runes/spawn first/runes640x360_c1.html";
}

// Initialisation des slots à l'ouverture de la page
// Initialisation des slots à l'ouverture de la page
window.addEventListener('DOMContentLoaded', () => {
  const slots = document.querySelectorAll('.slot');
  slots.forEach((slot, i) => {
    const idx = i + 1;
    const name = localStorage.getItem(`slot${idx}name`);
    const difficulty = localStorage.getItem(`slot${idx}difficulty`);
    const coins = localStorage.getItem(`slot${idx}coins`) || 0;
    const life = localStorage.getItem(`slot${idx}life`) || 0;
    const location = localStorage.getItem(`slot${idx}location`) || "Lieu inconnu";

    if (name && difficulty) {
      // Slot déjà utilisé → image opacity 50%
      slot.querySelector('img').style.opacity = "0.5";

      slot.onclick = () => {
        // Supprimer toute modale déjà ouverte
        const oldForm = document.querySelector(".slot-form");
        if (oldForm) oldForm.remove();

        // Créer la div modale
        const form = document.createElement("div");
        form.className = "slot-form";

        form.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;padding-bottom:6px; margin-bottom:8px;margin-right:5px;">
            <h2 style="flex:1; text-align:left; margin:0;margin-left:5px;margin-right:30px;">${name}</h2>
            <div style="display:flex; gap:12px; align-items:center;">
              <div style="display:flex; align-items:center; gap:4px;">
                <img src="../../assets/UI/mdi/coin.png" alt="Coins" style="width:18px; height:18px;">
                <span>${coins}</span>
              </div>
              <div style="display:flex; align-items:center; gap:4px;">
                <img src="../../assets/UI/mdi/hearth.png" alt="Vie" style="width:18px; height:18px;">
                <span>${life}</span>
              </div>
            </div>
          </div>
          <div class="form-body" style="align-items:flex-start; text-align:left;">
            <p><strong>Difficulté :</strong> ${difficulty}</p>
            <p><strong>Lieu :</strong> ${location}</p>
          </div>
          <div class="form-actions">
            <button onclick="closeSlotForm()">Retour</button>
            <button onclick="startNewGame(${idx})">Charger</button>
          </div>
        `;

        document.body.appendChild(form);
      };
    }
  });
});

  const slots = document.querySelectorAll('.slot');
  slots.forEach((slot, i) => {
    const idx = i + 1;
    const name = localStorage.getItem(`slot${idx}name`);
    const difficulty = localStorage.getItem(`slot${idx}difficulty`);

    if (name && difficulty) {
      // Slot déjà utilisé → image opacity 50%
      slot.querySelector('img').style.opacity = "0.5";

      slot.onclick = () => {
        // Supprimer toute modale déjà ouverte
        const oldForm = document.querySelector(".slot-form");
        if (oldForm) oldForm.remove();

        // Créer la div modale
        const form = document.createElement("div");
        form.className = "slot-form";

        // Contenu avec infos de la partie
        form.innerHTML = `
          <h2>Slot ${idx} déjà utilisé</h2>
          <div class="form-body">
            <p>Nom : ${name}</p>
            <p>Difficulté : ${difficulty}</p>
          </div>
          <div class="form-actions">
            <button onclick="closeSlotForm()">Retour</button>
            <button onclick="startNewGame(${idx})">Jouer</button>
          </div>
        `;

        document.body.appendChild(form);
      };
    }
  });

let chosenDifficulty = null;

function selectDifficulty(btn, diff) {
  // reset tous les boutons
  document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
  // activer le bouton cliqué
  btn.classList.add('active');
  // sauvegarder la valeur
  chosenDifficulty = diff;
}


  </script>
