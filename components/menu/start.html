<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fractura - Map animée</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
    }

    .stack {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 50px;
    }

    .stack img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      transform-origin: center;
      opacity: 0;
      animation: pop 0.5s forwards, pulse 0.3s forwards;
    }

    @keyframes pop { 
      to { opacity: 1; transform: translate(-50%, -50%) scale(3); } 
    }

    @keyframes pulse { 
      from { transform: translate(-50%, -50%) scale(3); } 
      to { transform: translate(-50%, -150%) scale(3.1); } 
    }

    .stack img:nth-child(1) { animation-delay: 0ms, 3000ms; }
    .stack img:nth-child(2) { animation-delay: 300ms, 3000ms; }
    .stack img:nth-child(3) { animation-delay: 600ms, 3000ms; }
    .stack img:nth-child(4) { animation-delay: 900ms, 3000ms; }
    .stack img:nth-child(5) { animation-delay: 1200ms, 3000ms; }
    .stack img:nth-child(6) { animation-delay: 1500ms, 3000ms; }
    .stack img:nth-child(7) { animation-delay: 1800ms, 3000ms; }
    .stack img:nth-child(8) { animation-delay: 2100ms, 3000ms; }

    .press-start {
      opacity: 0;
      margin-top: 150px;
      transform: scale(3);
      animation: fadeIn 1s forwards, float 1s infinite alternate;
      animation-delay: 4200ms, 5200ms;
    }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes float { 0% { transform: translateY(0) scale(3); } 100% { transform: translateY(-5px) scale(3); } }

    @font-face {
      font-family: 'pixelise';
      src: url('../../assets/fonts/Retro Gaming.ttf') format('truetype');
    }

    .version-text {
      position: fixed;
      bottom: 10px;
      left: 10px;
      font-family: 'pixelise', monospace;
      font-size: 14px;
      color: white;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 50px;
      align-items: center;
      pointer-events: none;
    }

    .menu-buttons.show { pointer-events: auto; }

    .menu-btn {
      font-family: 'pixelise', monospace;
      font-size: 24px;
      color: white;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 20px;
      cursor: pointer;
      transition: all 0.15s ease-out;
      transform: scale(0.6) rotate(0deg);
      opacity: 0;
    }

    .menu-buttons.show .menu-btn:nth-child(1) {
      animation: buttonAppear 0.3s forwards 0.1s;
    }
    .menu-buttons.show .menu-btn:nth-child(2) {
      animation: buttonAppear 0.3s forwards 0.25s;
    }

    @keyframes buttonAppear {
      from { opacity: 0; transform: scale(0.6) rotate(0deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }


    .menu-btn:hover,
    .menu-btn.active {
     background-color: #6800E4;
     border-bottom: 6px solid #8226CD;
     transform: scale(1) rotate(3deg); /* scale ET rotate ensemble */
    }

    .menu-btn:active {
     transform: scale(1.25) rotate(-2deg); /* idem */
     background-color: #39017d;
     border-bottom: none;
    }

    .menu-btn.keyboard-active {
      background-color: #39017d;
      border-bottom: none;
    }
    .menu-btn:focus {
      outline: none;
    }


    .controls-info {
      position: fixed;
      bottom: 30px; /* juste au-dessus de la version */
      right: 10px;
      font-family: 'pixelise', monospace;
      font-size: 14px;
      color: white;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .controls-info .fleches {
      transform: scale(3.2);
      margin-right:30px;
      width: 21px; /* ajuste selon la taille de ton image */
      height: 10px;
      display: inline-block;
    }

    .controls-info .entrer {
      transform: scale(3.2);
      margin-right:30px;
      width: 19px; /* ajuste selon la taille de ton image */
      height: 13px;
      display: inline-block;
    }

    #controlsInfo {
      opacity: 0; /* invisible au départ */
      transition: opacity 0.5s ease-in-out; /* fondu */
    }
    #controlsInfo.show {
      opacity: 1; /* visible quand on ajoute la classe show */
    }
    /* Slot container */
.slots-container {
  display: none;
  margin-top: 66px;
  display: grid;
  grid-template-columns: repeat(4, 130px);
  gap: 20px;
  justify-content: center;
}

.slot {
  width: 130px;
  height: 160px; /* un peu plus haut pour le texte */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  cursor: pointer;
  opacity: 0;
  transform: scale(0.8);
  animation: slotAppear 0.5s forwards;
}

.slot:nth-child(1) { animation-delay: 0.1s; }
.slot:nth-child(2) { animation-delay: 0.25s; }
.slot:nth-child(3) { animation-delay: 0.4s; }
.slot:nth-child(4) { animation-delay: 0.55s; }

.slot img {
  width: 65px;
  height: 65px;
  transform: scale(2);
  transform-origin: center;
}
.slot img:hover {
  transform: translate(-2%, -2%) scale(2.1) rotate(3deg);
  transition: transform 0.2s ease-in-out;
}
.slot img:active {
  transform: translate(-2%, -2%) scale(2.3) rotate(-2deg);
  transition: transform 0.2s ease-in-out;
}

.slot-form:hover {
  transform: translate(-2%, -2%) scale(2.1) rotate(3deg);
  transition: transform 0.2s ease-in-out;
}
/* Label "Slot 1, Slot 2..." */
.slot-label {
  margin-top: 30px;
  font-family: 'pixelise', monospace;
  font-size: 14px;
  color: white;
}

/* Formulaire qui remplace l'image */
@keyframes slotFormAppear {
  from {
    opacity: 0;
    transform: scale(1.5) rotate(-4deg);
  }
  to {
    opacity: 1;
    transform: scale(2);
  }
}

.slot-form {
  width: 75px;
  height: 70px;
  margin-right: 25px;
  background: #6800E4;
  color: white;
  font-family: 'pixelise', monospace;
  font-size: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-bottom: 5px solid #8226CD;
  animation: slotFormAppear 0.3s ease-out forwards;
  transform-origin: center;
}

/* Input + Select stylisés */
.slot-form input,
.slot-form select {
  width: 90%;
  margin: 3px 0;
  font-size: 10px;
  font-family: 'pixelise', monospace;
  background: #39017d;
  border: none;
  border-bottom: 2px solid #8226CD;
  color: white;
  padding: 2px;
  text-align: center;
}
.slot-form input:focus,
.slot-form select:focus {
  outline: none;
  border-bottom: 2px solid #fff;
}

  @keyframes slotAppear {
  from {
    opacity: 0;
    transform: scale(0.8);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
  </style>
</head>
<body>
  <div class="stack">
    <img src="../../components/menu/lettres fractura/f.png" alt="F">
    <img src="../../components/menu/lettres fractura/r.png" alt="R">
    <img src="../../components/menu/lettres fractura/a.png" alt="A">
    <img src="../../components/menu/lettres fractura/c.png" alt="C">
    <img src="../../components/menu/lettres fractura/t.png" alt="T">
    <img src="../../components/menu/lettres fractura/u.png" alt="U">
    <img src="../../components/menu/lettres fractura/r_2.png" alt="R">
    <img src="../../components/menu/lettres fractura/an.png" alt="AN">
  </div>

  <div class="press-start" id="pressStart">
    <img src="../../components/menu/start_kb.png" alt="Press Start">
  </div>

  <div class="menu-buttons" id="menuButtons">
    <button class="menu-btn" id="btnContinue" onclick="debug()">Continuer</button>
    <button class="menu-btn" id="btnNewGame" onclick="showSlots()">Nouvelle Partie</button>
  </div>
  
  <!-- Conteneur des slots (caché au départ) -->
    <div class="slots-container" id="slotsContainer" style="display: none;">
    <div class="slot" onclick="createSlot(this, 1)">
      <img src="../../assets/UI/+.png" alt="+" width="65" height="65">
      <div class="slot-label">Slot 1</div>
    </div>
    <div class="slot" onclick="createSlot(this, 2)">
      <img src="../../assets/UI/+.png" alt="+" width="65" height="65">
      <div class="slot-label">Slot 2</div>
    </div>
    <div class="slot" onclick="createSlot(this, 3)">
      <img src="../../assets/UI/+.png" alt="+" width="65" height="65">
      <div class="slot-label">Slot 3</div>
    </div>
    <div class="slot" onclick="createSlot(this, 4)">
      <img src="../../assets/UI/+.png" alt="+" width="65" height="65">
      <div class="slot-label">Slot 4</div>
    </div>
  </div>


  <div class="controls-info" id="controlsInfo">
    <img src="../../assets/UI/title screen/up_down_arrows.png" alt="Flèches" class="fleches"> 
    <span style="font-size:25px;">Flèches Naviguer &nbsp;&nbsp;&nbsp;&nbsp; </span>
    <img src="../../assets/UI/title screen/entrer_blanc.png" alt="Entrée" class="entrer"> 
    <span style="font-size:25px;">Valider</span>
  </div>


  <script>
    const menuButtons = document.querySelectorAll('.menu-btn');
    let activeIndex = -1; // aucun bouton sélectionné par défaut

    function debug() {
        console.log("Bouton cliqué !");
    }
    document.addEventListener('keydown', function(event) {
      const menu = document.getElementById('menuButtons');
      const pressStart = document.getElementById('pressStart');
      const controlsInfo = document.getElementById('controlsInfo');

      // Affiche les boutons après "Press Start"
      if (!menu.classList.contains('show')) {
        if (event.key === 'Enter') {
          pressStart.style.display = 'none';
          menu.classList.add('show');
          controlsInfo.classList.add('show'); // affiche les textes des contrôles
        }
        return;
      }

      // Navigation dans les boutons
      if (event.key === 'ArrowDown') {
        if (activeIndex >= 0) menuButtons[activeIndex].classList.remove('active');
        activeIndex = (activeIndex + 1) % menuButtons.length;
        menuButtons[activeIndex].classList.add('active');
      } else if (event.key === 'ArrowUp') {
        if (activeIndex >= 0) menuButtons[activeIndex].classList.remove('active');
        activeIndex = (activeIndex - 1 + menuButtons.length) % menuButtons.length;
        menuButtons[activeIndex].classList.add('active');
      } else if (event.key === 'Enter') {
        if (activeIndex >= 0) {
          const btn = menuButtons[activeIndex];
          btn.classList.add('keyboard-active');  // simule le style :active
          btn.click();                           // déclenche l'action
          setTimeout(() => btn.classList.remove('keyboard-active'), 150); // retire l'effet
        }
      }
    });

    function showSlots() {
      const slots = document.getElementById("slotsContainer");
      // toggle affichage
      if (slots.style.display === "none" || slots.style.display === "") {
        slots.style.display = "grid"; // affiche les slots
      } else {
        slots.style.display = "none"; // masque si déjà affichés
      }
    }


    function createSlot(slotElement, index) {
      const slots = document.querySelectorAll('.slot');

      // refermer les autres slots
      slots.forEach(s => {
        if (s !== slotElement) {
          s.innerHTML = `
            <img src="../../assets/UI/+.png" alt="+" width="65" height="65">
            <div class="slot-label">Slot ${[...slots].indexOf(s) + 1}</div>
          `;
          s.onclick = () => createSlot(s, [...slots].indexOf(s) + 1);
        }
      });
    
      // remplir le slot actuel avec le formulaire
      slotElement.innerHTML = `
        <div class="slot-form" style="border-radius:5px;">
          <input type="text" placeholder="Nom" />
          <select>
            <option>Facile</option>
            <option>Moyen</option>
            <option>Difficile</option>
          </select>
        </div>
      `;
      slotElement.onclick = null;
    }
  </script>

  <div class="version-text">v1.0.0-beta</div>
</body>
</html>
