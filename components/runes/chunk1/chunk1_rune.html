<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Fractura - Map</title>
  <style>
    body {
      margin: 0;
      background: #489BFF;
      overflow: hidden;
      color: white;
      font-family: cutepixel;
    }

    .map-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1809px;
      height: 947px;
      image-rendering: pixelated;
    }

    /* HUD coordonnées */
    #coords {
      position: absolute;
      top: 5px;
      left: 5px;
      font-size: 32px;
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 999;
    }

    #map-container {
      position: relative;
      width: 1809px;
      height: 947px;
      overflow: hidden;
      margin: 0 auto; /* centré horizontalement */
    }


    #player {
      position: absolute;
      width: 13px;   /* taille originale de la frame */
      height: 18px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(4); /* ×3 sans flou */
      transform-origin: center;
      background-repeat: no-repeat;
      background-color:rgba(0,0,139,0); /* changer le 0.0 en 0.3 pour voir hitbox du player */
      image-rendering: pixelated; /* pas de flou */
      z-index: 6;
    }
  </style>
</head>
<body>
  <!-- Conteneur global centré -->
  <div id="map-container">
    <img src="1_ground.png" class="map-layer" style="z-index: 1;">
    <img src="2_plantes_fillers.png" class="map-layer" style="z-index: 2;">
    <img src="3_water.png" class="map-layer" style="z-index: 3;">
    <img src="4_chemin_parrois.png" class="map-layer" style="z-index: 4;">
    <img src="5_rochers_pilliers.png" class="map-layer" style="z-index: 5;">
    <img src="6_herbe.png" class="map-layer" style="z-index: 6;">
    <img src="7_arbres_bush.png" class="map-layer" style="z-index: 7;">
    <img src="8_herbe_dessus.png" class="map-layer" style="z-index: 8;">

    <!-- Joueur -->
    <div id="player"></div>
  </div>


  <!-- HUD coordonnées -->
  <div id="coords">X: 0 | Y: 0</div>

  <script>
    const player = document.getElementById("player");
    const coords = document.getElementById("coords");

    let posX = window.innerWidth / 2;
    let posY = window.innerHeight / 2;
    let baseSpeed = 0.3;
    let runSpeed = 2.5;
    let currentSpeed = baseSpeed;


    // état des touches
    const keys = { w: false, a: false, s: false, d: false };

    // chemins vers tes images pour chaque direction
    const sprites = {
      w: "../../../assets/player/W.png",    // nord
      s: "../../../assets/player/S.png",    // sud
      a: "../../../assets/player/A.png",    // ouest
      d: "../../../assets/player/D.png",    // est
      wa: "../../../assets/player/WA.png",  // nord-ouest
      wd: "../../../assets/player/WD.png",  // nord-est
      sa: "../../../assets/player/SA.png",  // sud-ouest
      sd: "../../../assets/player/SD.png"   // sud-est
    };

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (keys.hasOwnProperty(key)) keys[key] = true;
        
      if (e.key === " ") {
        currentSpeed = runSpeed; // courir
      }
    });
    
    document.addEventListener("keyup", (e) => {
      const key = e.key.toLowerCase();
      if (keys.hasOwnProperty(key)) keys[key] = false;
    
      if (e.key === " ") {
        currentSpeed = baseSpeed; // retour normal
      }
    });

    function getDirection() {
      if (keys.w && keys.a) return "wa";
      if (keys.w && keys.d) return "wd";
      if (keys.s && keys.a) return "sa";
      if (keys.s && keys.d) return "sd";
      if (keys.w) return "w";
      if (keys.s) return "s";
      if (keys.a) return "a";
      if (keys.d) return "d";
      return null;
    }

    function gameLoop() {
      let moved = false;
      let nextX = posX;
      let nextY = posY;

      if (keys.w) { nextY -= currentSpeed; moved = true; }
      if (keys.s) { nextY += currentSpeed; moved = true; }
      if (keys.a) { nextX -= currentSpeed; moved = true; }
      if (keys.d) { nextX += currentSpeed; moved = true; }


      // appliquer collision avant de mettre à jour posX/posY
      [nextX, nextY] = checkHitbox(nextX, nextY);

      posX = nextX;
      posY = nextY;

      player.style.left = posX + "px";
      player.style.top = posY + "px";

      // choisir le sprite en fonction des touches
      const dir = getDirection();
      if (dir) {
        player.style.backgroundImage = `url(${sprites[dir]})`;
      }

      checkDepth(); // gestion du z-index
      coords.textContent = `X: ${Math.round(posX)} | Y: ${Math.round(posY)}`;

      requestAnimationFrame(gameLoop);
    }


    let showZones = false; // flag pour afficher/masquer les zones
    let showHitboxes = false; // flag pour afficher/masquer les hitboxes

    // appuyer sur F1 pour afficher/masquer les zones
    document.addEventListener("keydown", (e) => {
        if (e.key === "F6") {
            showZones = !showZones; // toggle on/off
            e.preventDefault(); // empêche l'action par défaut de F1 (aide)
            checkDepth(); // mettre à jour l'affichage
        }
    })
    // appuyer sur F2 pour afficher/masquer les hitboxes
    document.addEventListener("keydown", (e) => {
        if (e.key === "F7") {
            showHitboxes = !showHitboxes;
            e.preventDefault();
            checkHitbox(); // met à jour affichage
        }
    });
    // vérifier la profondeur du player
    function checkDepth() {
    const zones = [
        { x1: 964, x2: 1108, y1: 532, y2: 607 },
        { x1: 1004, x2: 1148, y1: 522, y2: 607 },
        { x1: 1190, x2: 1316, y1: 395, y2: 449 },
        { x1: 734, x2: 808, y1: 800, y2: 845 },
        { x1: 436, x2: 520, y1: 753, y2: 795 },
        { x1: 384, x2: 560, y1: 370, y2: 455 },
    ];

    const rocks = [
        { x1: 1000, x2: 1104, y1: 699, y2: 737 },
        { x1: 830, x2: 916, y1: 843, y2: 869 },
        { x1: 290, x2: 402, y1: 789, y2: 831 },
        { x1: 240, x2: 308, y1: 825, y2: 859 },
        { x1: 150, x2: 218, y1: 623, y2: 695 },
        { x1: 435, x2: 505, y1: 385, y2: 415 },
        { x1: 878, x2: 959, y1: 540, y2: 556 },
        { x1: 992, x2: 1117, y1: 261, y2: 366 },
        { x1: 761, x2: 854, y1: 10, y2: 91 },
        { x1: 163, x2: 279, y1: 40, y2: 154 },
    ];

    // Supprimer les anciens rectangles si déjà créés
    document.querySelectorAll(".zone-visual, .rock-visual").forEach(el => el.remove());

    let inZone = false;
    let inRock = false;

    // zones bush/arbre
    zones.forEach(({x1, x2, y1, y2}, index) => {
        if (showZones) {
            const div = document.createElement("div");
            div.classList.add("zone-visual");
            div.style.position = "absolute";
            div.style.left = x1 + "px";
            div.style.top = y1 + "px";
            div.style.width = (x2 - x1) + "px";
            div.style.height = (y2 - y1) + "px";
            div.style.backgroundColor = "rgba(255,0,0,0.3)";
            div.style.pointerEvents = "none";
            div.style.zIndex = 999;

            // numéroter la zone
            div.textContent = index + 1;
            div.style.color = "white";
            div.style.fontSize = "40px";
            div.style.fontWeight = "bold";
            div.style.display = "flex";
            div.style.alignItems = "center";
            div.style.justifyContent = "center";

            document.body.appendChild(div);
        }

        if (posX >= x1 && posX <= x2 && posY >= y1 && posY <= y2) {
            inZone = true;
        }
    });

    // zones rocks
    rocks.forEach(({x1, x2, y1, y2}, index) => {
        if (showZones) {
            const div = document.createElement("div");
            div.classList.add("rock-visual");
            div.style.position = "absolute";
            div.style.left = x1 + "px";
            div.style.top = y1 + "px";
            div.style.width = (x2 - x1) + "px";
            div.style.height = (y2 - y1) + "px";
            div.style.backgroundColor = "rgba(0,0,139,0.3)";
            div.style.pointerEvents = "none";
            div.style.zIndex = 999;

            // numéroter le rock
            div.textContent = index + 1;
            div.style.color = "white";
            div.style.fontSize = "40px";
            div.style.fontWeight = "bold";
            div.style.display = "flex";
            div.style.alignItems = "center";
            div.style.justifyContent = "center";

            document.body.appendChild(div);
        }

        if (posX >= x1 && posX <= x2 && posY >= y1 && posY <= y2) {
            inRock = true;
        }
    });

    // appliquer le z-index selon la priorité
    if (inZone) {
        player.style.zIndex = 7;
    } else if (inRock) {
        player.style.zIndex = 4;
    } else {
        player.style.zIndex = 6;
    }
}

    function checkHitbox(x, y) {
      const hitzones = [
          { x1: 1010, x2: 1146, y1: 388, y2: 413 }, // 1
          { x1: 750, x2: 820, y1: 807, y2: 831 }, // 2
          { x1: 1019, x2: 1136, y1: 727, y2: 793 }, // 3
          { x1: 856, x2: 1383, y1: 13, y2: 380 }, // 4
          { x1: 461, x2: 928, y1: 0, y2: 82 }, // 5
          { x1: 0, x2: 200, y1: 0, y2: 263 }, // 6 
          { x1: 200, x2: 516, y1: 228, y2: 363 }, // 7
          { x1: 352, x2: 414, y1: 380, y2: 478 }, // 8
          { x1: 400, x2: 589, y1: 440, y2: 570 }, // 9
          { x1: 436, x2: 485, y1: 575, y2: 695 }, // 10
          { x1: 0, x2: 485, y1: 597, y2: 695 }, // 11
          { x1: 0, x2: 168, y1: 597, y2: 1000 }, // 12
          // a droite
          { x1: 1312, x2: 1418, y1: 337, y2: 775 }, // 13
          { x1: 1210, x2: 1418, y1: 740, y2: 1000 }, // 14
          { x1: 168, x2: 247, y1: 695, y2: 751 }, // 15
          { x1: 770, x2: 900, y1: 82, y2: 142 }, // 16
          { x1: 200, x2: 280, y1: 166, y2: 250 }, // 17
          { x1: 384, x2: 455, y1: 370, y2: 380 }, // 18
          { x1: 443, x2: 526, y1: 407, y2: 440 }, // 19
      ];

    // supprimer anciens hitboxes
    document.querySelectorAll(".hitbox-visual").forEach(el => el.remove());

    const pw = player.offsetWidth;
    const ph = player.offsetHeight;

    let newX = x;
    let newY = y;

    // ----- Vérif axe X -----
    hitzones.forEach(({ x1, x2, y1, y2 }, index) => {
        if (showHitboxes) {
            const div = document.createElement("div");
            div.classList.add("hitbox-visual");
            div.style.position = "absolute";
            div.style.left = x1 + "px";
            div.style.top = y1 + "px";
            div.style.width = (x2 - x1) + "px";
            div.style.height = (y2 - y1) + "px";
            div.style.border = "3px solid white";
            div.style.pointerEvents = "none";
            div.style.zIndex = 1000;
        
            // ajouter un numéro
            div.textContent = index + 1;
            div.style.color = "white";
            div.style.fontSize = "45px";
            div.style.fontWeight = "bold";
            div.style.background = "rgba(0,0,0,0.4)";
            div.style.display = "flex";
            div.style.alignItems = "center";
            div.style.justifyContent = "center";
        
            document.getElementById("map-container").appendChild(div);
        }
      
        if (newX + pw > x1 && newX < x2 && posY + ph > y1 && posY < y2) {
            if (keys.a) newX = x2;        // bloque à gauche
            if (keys.d) newX = x1 - pw;   // bloque à droite
        }
    });

    // ----- Vérif axe Y (avec X déjà corrigé) -----
    hitzones.forEach(({ x1, x2, y1, y2 }) => {
        if (newX + pw > x1 && newX < x2 && newY + ph > y1 && newY < y2) {
            if (keys.w) newY = y2;        // bloque en haut
            if (keys.s) newY = y1 - ph;   // bloque en bas
        }
    });


    return [newX, newY];
}

    gameLoop();
  </script>
</body>
</html>
